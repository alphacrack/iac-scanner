# Ruff config for iac-scanner
target-version = "py310"
line-length = 120
src = ["src", "tests"]
exclude = [
  "samples", "out", "out-cdk", "dist", ".git",
  # Generated by setuptools-scm at build/install time. Tracked in .gitignore;
  # locally it may exist after `pip install -e .` and should not be linted.
  "src/iac_scanner/_version.py",
]

[lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[format]
quote-style = "double"
