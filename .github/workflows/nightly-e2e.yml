name: Nightly E2E

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated providers to test (openai,anthropic,github,ollama)"
        required: false
        default: "openai,anthropic"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, github, ollama]
    env:
      # Cost cap per scan — abort any E2E that projects higher than this
      IAC_MAX_SPEND_USD: "0.25"
      # Disable response cache so E2E genuinely hits the LLM
      IAC_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,all]"

      # ---------- Ollama only: start a local server ----------
      - name: Start Ollama (local LLM)
        if: matrix.provider == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.1:8b-instruct-q4_K_M

      # ---------- Provider-specific env ----------
      - name: Configure provider env
        id: cfg
        env:
          PROVIDER: ${{ matrix.provider }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "IAC_PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
          skip=false
          case "$PROVIDER" in
            openai)
              if [ -n "$OPENAI_KEY" ]; then
                echo "OPENAI_API_KEY=$OPENAI_KEY" >> "$GITHUB_ENV"
              else
                echo "::warning::OPENAI_API_KEY not set, skipping E2E for openai"
                skip=true
              fi
              ;;
            anthropic)
              if [ -n "$ANTHROPIC_KEY" ]; then
                echo "ANTHROPIC_API_KEY=$ANTHROPIC_KEY" >> "$GITHUB_ENV"
              else
                echo "::warning::ANTHROPIC_API_KEY not set, skipping E2E for anthropic"
                skip=true
              fi
              ;;
            github)
              # GITHUB_TOKEN is always available in Actions
              echo "GITHUB_TOKEN=$GH_TOKEN_VALUE" >> "$GITHUB_ENV"
              ;;
            ollama)
              echo "OLLAMA_HOST=http://localhost:11434" >> "$GITHUB_ENV"
              ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests
        if: steps.cfg.outputs.skip != 'true'
        run: |
          # pytest exits 5 when no tests are collected (no @pytest.mark.e2e
          # tests exist yet); treat that as a pass rather than a failure.
          set +e
          pytest tests/ -v -m e2e --tb=short
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::notice::No e2e-marked tests collected (pytest exit 5), treating as pass"
            exit 0
          fi
          exit "$rc"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.provider }}
          path: |
            tests/e2e-output/
            *.log
