# CodeQL static analysis for Python.
#
# Results land in the Security tab → Code scanning alerts. Combined with the
# Scorecard workflow this satisfies the "Security-Policy" and "SAST" checks
# OpenSSF Scorecard looks for.

name: CodeQL

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: "27 4 * * 3"   # weekly, Wednesdays 04:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    # Deliberately no `strategy.matrix` — the workflow only analyzes one
    # language today. Previously a single-element matrix caused GitHub to
    # render the check as "Analyze (python) (python)" (matrix name appended
    # to the job name), which then had to be encoded verbatim in branch
    # protection. If a second language is added, re-introduce a matrix and
    # change `name:` above to just "Analyze" so the render is `Analyze (foo)`.

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
